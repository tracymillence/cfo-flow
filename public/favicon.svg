<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="geoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="geoDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221A14"/>
      <stop offset="100%" stop-color="#0C0907"/>
    </linearGradient>
    <filter id="geoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Dark Basalt Rounded Square Frame -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#geoDark)" stroke="url(#geoGold)" stroke-width="4.5"/>
  <!-- Zhongli Geo Rhombus / Diamond Frame -->
  <polygon points="50,18 80,48 50,78 20,48" fill="none" stroke="url(#geoGold)" stroke-width="4" stroke-linejoin="round"/>
  <!-- Faceted Diamond Body -->
  <polygon points="50,26 71,48 50,70 29,48" fill="url(#geoGold)" filter="url(#geoGlow)"/>
  <!-- Center Core Shine -->
  <polygon points="50,35 62,48 50,61 38,48" fill="#FFFBEB"/>
  <!-- Geo Vision Amber Dot -->
  <circle cx="80" cy="20" r="6" fill="#FDE047"/>
</svg>

